<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor y Exportador Oficial Logo SASGE 2.0</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0F172A; color: #F8FAFC; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; }
    h1 { font-size: 26px; font-weight: 800; margin-bottom: 8px; color: #FFFFFF; }
    p { font-size: 14px; color: #94A3B8; margin-bottom: 30px; text-align: center; }
    .card { background: #1E293B; border-radius: 20px; padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); width: 100%; max-width: 1000px; margin-bottom: 30px; border: 1px solid #334155; }
    .preview-box { background: #0A0D14; border-radius: 14px; padding: 30px; display: flex; justify-content: center; align-items: center; border: 1px dashed #475569; overflow: hidden; }
    .preview-box.checkerboard {
      background-image: linear-gradient(45deg, #182234 25%, transparent 25%), linear-gradient(-45deg, #182234 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #182234 75%), linear-gradient(-45deg, transparent 75%, #182234 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      background-color: #0e1626;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; justify-content: flex-end; }
    button { background: #A9301E; color: white; border: none; padding: 10px 20px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; }
    button:hover { background: #8F2516; transform: translateY(-1px); }
    button.secondary { background: #334155; color: #E2E8F0; }
    button.secondary:hover { background: #475569; }
    svg { width: 100%; height: auto; max-width: 800px; }
  </style>
</head>
<body>
  <h1>Logo Oficial SASGE 2.0 (Header Secretaría Jurídica Distrital)</h1>
  <p>Formatos de alta fidelidad vectoriales listos para videos, presentaciones y piezas institucionales.</p>

  <!-- Versión con Fondo Oscuro Institucional -->
  <div class="card">
    <h2 style="font-size: 18px; margin-bottom: 12px; color: #F1F5F9;">1. Versión Header Institucional (Fondo Oscuro #210706)</h2>
    <div class="preview-box">
      <img id="logoDark" src="./SASGE_2.0_Header_Dark_4K.png" alt="SASGE Header Logo Dark" style="width: 100%; max-width: 800px; border-radius: 12px;">
    </div>
    <div class="actions">
      <a href="./SASGE_2.0_Header_Dark_4K.png" download="SASGE_2.0_Header_Dark_4K.png" style="text-decoration: none;">
        <button type="button">⬇️ Descargar en PNG 4K Ultra HD</button>
      </a>
      <a href="./sasge-header-logo-large.svg" download="sasge-header-logo-large.svg" style="text-decoration: none;">
        <button type="button" class="secondary">Abrir / Descargar SVG Vectorial</button>
      </a>
    </div>
  </div>

  <!-- Versión Transparente -->
  <div class="card">
    <h2 style="font-size: 18px; margin-bottom: 12px; color: #F1F5F9;">2. Versión Transparente (Para superponer en videos / banners)</h2>
    <div class="preview-box checkerboard">
      <img id="logoTrans" src="./SASGE_2.0_Header_Transparente_4K.png" alt="SASGE Header Logo Transparent" style="width: 100%; max-width: 800px;">
    </div>
    <div class="actions">
      <a href="./SASGE_2.0_Header_Transparente_4K.png" download="SASGE_2.0_Header_Transparente_4K.png" style="text-decoration: none;">
        <button type="button">⬇️ Descargar en PNG 4K Transparente</button>
      </a>
      <a href="./sasge-header-logo-transparent.svg" download="sasge-header-logo-transparent.svg" style="text-decoration: none;">
        <button type="button" class="secondary">Abrir / Descargar SVG Vectorial</button>
      </a>
    </div>
  </div>

</body>
</html>
